; Step 11: STM32F103C8T6 (Blue Pill) I2C target at 0x42, Standard Peripheral Library, bare metal.
;
; Same layout as the author's STM32_StdPeriph lessons (VS Code + PlatformIO): no `framework`,
; because PlatformIO's framework-spl has no STM32F1 (only F0 / F3 / F4 / L1). CMSIS is in Start/,
; SPL V3.5.0 in Library/, GCC startup and linker script in startup/ and ldscript/ -- all copied
; unchanged from that repo (vendor.sha256). Our code is in Core/.
;
; Built on the Jetson (aarch64): toolchain-gccarmnoneeabi 1.70201.0 (GCC 7.2.1, what the lessons
; use on x86) has no linux_aarch64 package, 1.120301.0 (GCC 12.3.1) has. GCC 12's assembler
; rejects the -g2 that `build_type = debug` passes to .s files, so this is a release build.
; -Wall -Wextra -Werror cover main.c (the host build only compiles i2c_target.c); the vendor
; files build clean with them too.

[platformio]
src_dir = .

[env:bluepill]
platform = ststm32@20.0.0
board = genericSTM32F103C8
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.120301.0
    platformio/tool-openocd@3.1200.7

board_build.ldscript = ldscript/STM32F103C8_FLASH.ld

build_flags =
    -D STM32F10X_MD
    -D USE_STDPERIPH_DRIVER
    -I Core/Inc
    -I Start
    -I Library
    -specs=nano.specs
    -specs=nosys.specs
    -Wall
    -Wextra
    -Werror

; Only the SPL drivers this firmware calls. Start/core_cm3.c is left out: its old inline asm
; (__STREXB / __STREXH) does not assemble with newer GNU as, and core_cm3.h inlines what we use.
build_src_filter =
    -<*>
    +<Core/Src/>
    +<Library/misc.c>
    +<Library/stm32f10x_adc.c>
    +<Library/stm32f10x_gpio.c>
    +<Library/stm32f10x_i2c.c>
    +<Library/stm32f10x_rcc.c>
    +<Start/system_stm32f10x.c>
    +<startup/>

; ST-Link V2 over SWD. OpenOCD 0.12 supports only "swd" (not the platform's default hla_swd)
; with this ST-Link firmware (V2Jxx), as found in the lessons.
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-openocd/bin/openocd" -s "${platformio.packages_dir}/tool-openocd/openocd/scripts" -f interface/stlink.cfg -c "transport select swd" -f target/stm32f1x.cfg -c "program {$PROG_PATH} verify reset; shutdown"
